<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CR Matcher — Offline Board</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       1. DESIGN SYSTEM & COLOR THEME VARIABLES (GitHub Default & Green Accent)
       ========================================================================== */
    :root {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    [data-theme='light'] {
      --color-bg: #f6f8fa;
      --color-surface: #ffffff;
      --color-surface-elevated: #ffffff;
      --color-text: #24292f;
      --color-text-secondary: #57606a;
      --color-accent: #2da44e; /* GitHub Light Green */
      --color-accent-hover: #2c974b;
      --color-accent-soft: rgba(45, 164, 78, 0.08);
      --color-border: #d0d7de;
      --color-border-light: #ebf0f4;
      --color-muted: #57606a;
      --color-success: #1a7f37;
      --color-success-soft: rgba(26, 127, 55, 0.08);
      --color-danger: #cf222e;
      --color-danger-soft: rgba(207, 34, 46, 0.08);
      --color-warning: #9a6700;
      --color-warning-soft: rgba(154, 103, 0, 0.08);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(208, 215, 222, 0.5);
      --shadow-sm: 0 1px 2px rgba(27, 31, 36, 0.04);
      --shadow-md: 0 3px 6px rgba(140, 149, 159, 0.1);
      --shadow-lg: 0 8px 24px rgba(140, 149, 159, 0.15);
      --shadow-xl: 0 12px 32px rgba(140, 149, 159, 0.2);
    }

    [data-theme='dark'] {
      --color-bg: #0d1117;
      --color-surface: #161b22;
      --color-surface-elevated: #21262d;
      --color-text: #c9d1d9;
      --color-text-secondary: #8b949e;
      --color-accent: #238636; /* GitHub Dark Green */
      --color-accent-hover: #2ea44f;
      --color-accent-soft: rgba(35, 134, 54, 0.12);
      --color-border: #30363d;
      --color-border-light: #21262d;
      --color-muted: #8b949e;
      --color-success: #238636;
      --color-success-soft: rgba(35, 134, 54, 0.12);
      --color-danger: #da3633;
      --color-danger-soft: rgba(218, 54, 51, 0.12);
      --color-warning: #d29922;
      --color-warning-soft: rgba(210, 153, 34, 0.12);
      --glass-bg: rgba(22, 27, 34, 0.85);
      --glass-border: rgba(48, 54, 61, 0.6);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
      --shadow-xl: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    /* ==========================================================================
       2. RESET & BASE LAYOUT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      font-size: 0.9375rem;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
    }

    /* Layout Utility classes */
    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .flex { display: flex; }
    .align-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .text-muted { color: var(--color-muted); }
    .text-secondary { color: var(--color-text-secondary); }
    .gap-sm { gap: 0.5rem; }

    /* ==========================================================================
       3. BUTTONS & BADGES
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.45rem 0.9rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--color-accent);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--color-accent-hover);
    }

    .btn-secondary {
      background-color: var(--color-surface);
      color: var(--color-text);
      border-color: var(--color-border);
    }
    .btn-secondary:hover:not(:disabled) {
      border-color: var(--color-text-secondary);
      background-color: var(--color-border-light);
    }

    .btn-danger {
      background-color: var(--color-danger-soft);
      color: var(--color-danger);
    }
    .btn-danger:hover:not(:disabled) {
      background-color: var(--color-danger);
      color: #ffffff;
    }

    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.8125rem;
      border-radius: 4px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 100px;
    }
    .badge-completed {
      background-color: var(--color-success-soft);
      color: var(--color-success);
      border: 1px solid rgba(35, 134, 54, 0.3);
    }

    /* ==========================================================================
       4. NAVBAR COMPONENTS
       ========================================================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      height: 3.75rem;
    }

    .navBrand {
      font-size: 1.125rem;
      font-weight: 800;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .navActions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .themeToggle {
      width: 2rem;
      height: 2rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      transition: all 0.2s;
    }
    .themeToggle:hover {
      color: var(--color-text);
      background-color: var(--color-border-light);
    }

    .userProfile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .avatar {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: var(--color-accent-soft);
      color: var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.875rem;
    }

    /* ==========================================================================
       5. VIEW: OFFLINE SIGN IN PAGE
       ========================================================================== */
    .loginView {
      min-height: calc(100vh - 3.75rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }
    
    .heroTitle {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      color: var(--color-text);
    }

    .heroSubtitle {
      font-size: 1.0625rem;
      color: var(--color-text-secondary);
      max-width: 500px;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* Sign In Card layout */
    .loginCard {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .loginCard h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .formGroup {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .formGroup label {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .input, .select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      font-size: 0.875rem;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      color: var(--color-text);
      outline: none;
      transition: border-color 0.2s;
    }

    .input::placeholder, .select::placeholder {
      color: var(--color-muted);
      font-weight: 400;
      opacity: 0.75;
    }

    .input:focus, .select:focus {
      border-color: var(--color-accent);
    }

    .suggestion-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--color-text-secondary);
      background-color: var(--color-border-light);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 0.35rem;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    
    .suggestion-tag:hover {
      background-color: var(--color-accent-soft);
      color: var(--color-accent);
      border-color: rgba(35, 134, 54, 0.3);
    }

    .divider {
      text-align: center;
      margin: 1.5rem 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background-color: var(--color-border);
      z-index: 1;
    }
    .divider span {
      background-color: var(--color-surface);
      padding: 0 0.75rem;
      position: relative;
      z-index: 2;
      color: var(--color-muted);
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* ==========================================================================
       6. VIEW: DASHBOARD & TABS
       ========================================================================== */
    .dashboardView {
      padding: 1.5rem 0;
    }

    .teamHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 1.5rem;
    }

    .teamInfo h1 {
      font-size: 1.625rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .headerActions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Custom Switchable Tabs (Active Reviews vs History) */
    .tabSwitch {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1.5rem;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 0.25rem;
      width: fit-content;
    }

    .tabBtn {
      padding: 0.375rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 6px;
      color: var(--color-text-secondary);
      transition: all 0.2s;
    }

    .tabBtn:hover {
      color: var(--color-text);
    }

    .tabBtnActive {
      background-color: var(--color-accent-soft);
      color: var(--color-accent);
    }

    /* Board header controls */
    .boardHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--color-border-light);
    }
    
    .boardTitle {
      font-size: 1.125rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .countBadge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.5rem;
      height: 1.5rem;
      padding: 0 0.375rem;
      border-radius: 100px;
      background: var(--color-accent-soft);
      color: var(--color-accent);
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* ==========================================================================
       7. ULTRA-PREMIUM CODE REVIEW CARDS GRID
       ========================================================================== */
    .crGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    /* Sleek developer-slate card design with official GitHub Green accent highlight */
    .crCard {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-accent); /* Left side color accent highlight */
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    
    .crCard:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--color-text-secondary);
    }

    .crCardHeader {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .crCardTitle {
      flex: 1;
      min-width: 0;
    }

    .crCardTitle h4 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: var(--color-text);
    }

    .prLink {
      font-size: 0.8125rem;
      color: var(--color-accent);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      margin-top: 0.25rem;
      font-weight: 500;
      max-width: 100%;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .prLink:hover {
      color: var(--color-accent-hover);
      text-decoration: underline;
    }

    .repoName {
      font-size: 0.75rem;
      color: var(--color-muted);
      margin-top: 0.125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .crMeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      background-color: var(--color-border-light);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
    }

    .reviewerSummary {
      font-weight: 600;
      color: var(--color-text);
    }

    .timeAgo {
      color: var(--color-muted);
      font-size: 0.75rem;
    }

    /* Review assignments section on card */
    .assignmentsSection {
      font-size: 0.8125rem;
      border-top: 1px dashed var(--color-border);
      padding-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .assignmentsSection strong {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--color-muted);
    }
    .reviewersList {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .reviewerLabel {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.5rem;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .reviewerCompleted {
      color: var(--color-success);
      border-color: rgba(35, 134, 54, 0.4);
      background-color: var(--color-success-soft);
    }

    .crCardFooter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-border-light);
      font-size: 0.8125rem;
      margin-top: auto;
    }

    .requesterInfo {
      color: var(--color-text-secondary);
      font-weight: 500;
    }
    .requesterInfo strong {
      color: var(--color-text);
      font-weight: 700;
    }

    .cardActions {
      display: flex;
      gap: 0.35rem;
    }

    /* Empty state */
    .emptyState {
      text-align: center;
      padding: 4rem 2rem;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
    }
    .emptyState h3 {
      font-size: 1.125rem;
      margin-bottom: 0.25rem;
    }
    .emptyState p {
      font-size: 0.875rem;
      color: var(--color-muted);
    }

    /* ==========================================================================
       8. MODAL POPUPS
       ========================================================================== */
    .modalOverlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 480px;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modalHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .modalHeader h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }
    
    .modalClose {
      color: var(--color-muted);
      font-size: 1.25rem;
      transition: color 0.2s;
    }
    .modalClose:hover {
      color: var(--color-text);
    }

    /* Tracked Repos List inside settings modal */
    .repoList {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 180px;
      overflow-y: auto;
    }
    .repoListItem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
    }

    /* ==========================================================================
       9. TOAST ALERTS & ANIMATIONS
       ========================================================================== */
    .toastContainer {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      background-color: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-accent);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 250px;
      max-width: 350px;
    }

    .toast-success { border-left-color: var(--color-success); }
    .toast-error { border-left-color: var(--color-danger); }
    .toast-info { border-left-color: var(--color-warning); }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @media (max-width: 768px) {
      .teamHeader {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="toastContainer"></div>

  <!-- NAVIGATION BAR -->
  <nav class="navbar">
    <div class="container flex align-center justify-between" style="height: 100%;">
      <a href="#" class="navBrand" onclick="app.showDashboard()">
        <!-- Code SVG Logo Icon (Brackets/Terminal Style) -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right: 0.25rem;"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        CR Matcher
      </a>
      
      <div class="navActions">
        <button id="theme-toggle" class="themeToggle" onclick="app.toggleTheme()" title="Toggle Theme">
          <!-- Moon SVG -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <div id="nav-user" style="display: none;">
          <div class="userProfile">
            <div id="user-avatar" class="avatar">U</div>
            <span id="user-display-name">User</span>
            <button class="btn btn-secondary btn-sm" onclick="app.logout()">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- APP CONTENT VIEWPORT -->
  <main id="app-viewport" class="container" style="padding-top: 1.5rem;"></main>

  <!-- ==========================================================================
       MODALS WRAPPERS
       ========================================================================== -->
  
  <!-- REQUEST CR MODAL -->
  <div id="request-modal" class="modalOverlay" style="display: none;">
    <div class="modal">
      <div class="modalHeader">
        <h2>Ask for Code Review</h2>
        <button class="modalClose" onclick="app.closeRequestModal()">✕</button>
      </div>
      <div class="formGroup">
        <label for="modal-pr-name">Pull Request Name</label>
        <input id="modal-pr-name" class="input" type="text" placeholder="e.g. feat: integrate billing module">
      </div>
      <div class="formGroup">
        <label for="modal-pr-url">Pull Request Link (Optional)</label>
        <input id="modal-pr-url" class="input" type="text" placeholder="e.g. https://github.com/my-org/my-repo/pull/12">
      </div>
      <div class="formGroup">
        <label for="modal-select-repo">Choose Repository</label>
        <select id="modal-select-repo" class="select">
          <!-- Dynamic -->
        </select>
      </div>
      <div class="formGroup">
        <label for="modal-reviewers">Number of Reviewers Needed</label>
        <select id="modal-reviewers" class="select">
          <option value="1" selected>1 Reviewer</option>
          <option value="2">2 Reviewers</option>
          <option value="3">3 Reviewers</option>
        </select>
      </div>
      <div class="flex" style="justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
        <button class="btn btn-secondary" onclick="app.closeRequestModal()">Cancel</button>
        <button class="btn btn-primary" onclick="app.submitRequestCR()">Submit Request</button>
      </div>
    </div>
  </div>

  <!-- TEAM SETTINGS MODAL -->
  <div id="settings-modal" class="modalOverlay" style="display: none;">
    <div class="modal">
      <div class="modalHeader">
        <h2>Team Repositories</h2>
        <button class="modalClose" onclick="app.closeSettingsModal()">✕</button>
      </div>
      <div class="formGroup">
        <label>Tracked Repositories for this Team</label>
        <div id="settings-repo-list" class="repoList">
          <!-- Dynamic -->
        </div>
        
        <div class="formGroup" style="margin-top: 0.5rem;">
          <label for="settings-new-repo">Add New Repository Name</label>
          <div class="flex gap-sm">
            <input id="settings-new-repo" class="input" type="text" placeholder="e.g. frontend-core">
            <button class="btn btn-primary" onclick="app.addTrackedRepo()">Add</button>
          </div>
        </div>
      </div>
      <div class="flex" style="justify-content: space-between; margin-top: 2rem; align-items: center;">
        <button class="btn btn-danger btn-sm" onclick="app.resetDatabase()">Reset App Data</button>
        <button class="btn btn-primary" onclick="app.closeSettingsModal()">Done</button>
      </div>
    </div>
  </div>

  <!-- CREATE TEAM MODAL -->
  <div id="create-team-modal" class="modalOverlay" style="display: none;">
    <div class="modal">
      <div class="modalHeader">
        <h2>Create New Team</h2>
        <button class="modalClose" onclick="app.closeCreateTeamModal()">✕</button>
      </div>
      <div class="formGroup">
        <label for="new-team-name">Team Name</label>
        <input id="new-team-name" class="input" type="text" placeholder="e.g. Team Alpha">
      </div>
      <div class="formGroup">
        <label for="new-team-desc">Description (Optional)</label>
        <input id="new-team-desc" class="input" type="text" placeholder="e.g. DevOps & Infra team">
      </div>
      
      <!-- Repository Selection inside Team Creation -->
      <div class="formGroup">
        <label>Tracked Repositories</label>
        <div id="new-team-repo-list" class="repoList" style="min-height: 40px; border: 1px dashed var(--color-border); border-radius: 6px; padding: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; justify-content: flex-start; max-height: 120px; overflow-y: auto;">
          <span style="font-size: 0.75rem; color: var(--color-muted); width: 100%; text-align: center;">No repositories added yet</span>
        </div>
        <div class="flex gap-sm" style="margin-top: 0.5rem;">
          <input id="new-team-new-repo" class="input" type="text" placeholder="e.g. frontend-app">
          <button class="btn btn-secondary btn-sm" onclick="app.addRepoToNewTeamList()">Add</button>
        </div>
        
        <!-- Suggestions row with clickable items (less bold suggestions) -->
        <div style="margin-top: 0.35rem; font-size: 0.75rem; color: var(--color-muted);">
          Suggestions: 
          <span class="suggestion-tag" onclick="app.quickAddRepo('frontend-app')">frontend-app</span>
          <span class="suggestion-tag" onclick="app.quickAddRepo('backend-api')">backend-api</span>
          <span class="suggestion-tag" onclick="app.quickAddRepo('devops-infra')">devops-infra</span>
        </div>
      </div>
      
      <div class="flex" style="justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
        <button class="btn btn-secondary" onclick="app.closeCreateTeamModal()">Cancel</button>
        <button class="btn btn-primary" onclick="app.submitCreateTeamOffline()">Create Team</button>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       OFFLINE ENGINE (LOCALSTORAGE JSON DATABASE)
       ========================================================================== -->
  <script>
    // Pure Offline Database Seed
    const DEFAULT_DB = {
      currentUser: null, // { id, name, teamId }
      teams: [
        { 
          id: 'team-omega', 
          name: 'Team Omega', 
          description: 'Frontend & API engineering team.',
          repos: ['frontend-main', 'api-gateway', 'auth-service']
        },
        { 
          id: 'team-beta', 
          name: 'Team Beta', 
          description: 'DevOps & Infrastructure team.',
          repos: ['k8s-configs', 'terraform-modules', 'ci-pipelines']
        }
      ],
      crRequests: [
        {
          id: 'cr-1',
          teamId: 'team-omega',
          prTitle: 'feat: add offline local storage database',
          prUrl: 'https://github.com/org/repo/pull/42',
          repoName: 'frontend-main',
          requiredReviewers: 2,
          status: 'COMPLETED',
          requesterName: 'Alice',
          assignments: [
            { reviewerName: 'Bob', status: 'COMPLETED', completedAt: new Date(Date.now() - 3600000).toISOString() },
            { reviewerName: 'Harel', status: 'COMPLETED', completedAt: new Date(Date.now() - 1800000).toISOString() }
          ],
          createdAt: new Date(Date.now() - 3600000 * 2).toISOString()
        },
        {
          id: 'cr-2',
          teamId: 'team-omega',
          prTitle: 'fix: align navbar spacing and styles',
          prUrl: '',
          repoName: 'frontend-main',
          requiredReviewers: 1,
          status: 'OPEN',
          requesterName: 'Bob',
          assignments: [],
          createdAt: new Date(Date.now() - 3600000 * 5).toISOString()
        }
      ]
    };

    class CRMatcherOfflineApp {
      constructor() {
        this.db = null;
        this.currentTab = 'active'; // active, history
        this.newTeamRepos = []; // Temporary repo list during team creation
        this.initDatabase();
      }

      initDatabase() {
        const stored = localStorage.getItem('crmatcher_pure_offline_db');
        if (stored) {
          try {
            this.db = JSON.parse(stored);
            if (!this.db.teams || this.db.teams.length === 0) this.db.teams = DEFAULT_DB.teams;
            if (!this.db.crRequests || this.db.crRequests.length === 0) this.db.crRequests = DEFAULT_DB.crRequests;
          } catch {
            this.db = DEFAULT_DB;
            this.saveDatabase();
          }
        } else {
          this.db = DEFAULT_DB;
          this.saveDatabase();
        }
      }

      saveDatabase() {
        localStorage.setItem('crmatcher_pure_offline_db', JSON.stringify(this.db));
      }

      resetDatabase() {
        if (confirm('Are you sure you want to reset all team data and active code reviews back to defaults?')) {
          localStorage.removeItem('crmatcher_pure_offline_db');
          this.initDatabase();
          this.addToast('App data reset successfully!', 'success');
          this.closeSettingsModal();
          this.render();
        }
      }

      // Toasts notifications (Using premium SVG Icons!)
      addToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        
        let iconSvg = '';
        if (type === 'success') {
          iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-success);"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
        } else if (type === 'error') {
          iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-danger);"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
        } else {
          iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-warning);"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
        }
        
        toast.innerHTML = `${iconSvg}<div>${message}</div>`;
        container.appendChild(toast);
        
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(10px)';
          toast.style.transition = 'all 0.3s ease';
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        
        // Update Theme Button Icon (Sun SVG vs Moon SVG)
        const toggleBtn = document.getElementById('theme-toggle');
        if (newTheme === 'dark') {
          toggleBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
        } else {
          toggleBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        }
      }

      // VIEW ROUTER
      render() {
        const viewport = document.getElementById('app-viewport');
        const userHeader = document.getElementById('nav-user');
        
        if (!this.db.currentUser) {
          userHeader.style.display = 'none';
          viewport.innerHTML = this.getLandingViewHTML();
          return;
        }

        userHeader.style.display = 'block';
        document.getElementById('user-display-name').innerText = this.db.currentUser.name;
        document.getElementById('user-avatar').innerText = this.db.currentUser.name[0].toUpperCase();

        viewport.innerHTML = this.getDashboardHTML();
        
        // Highlight active tab button
        document.getElementById('tab-active').className = `tabBtn ${this.currentTab === 'active' ? 'tabBtnActive' : ''}`;
        document.getElementById('tab-history').className = `tabBtn ${this.currentTab === 'history' ? 'tabBtnActive' : ''}`;
        
        this.renderBoard();
      }

      // OFFLINE LOGIN SIGN IN ACTIONS
      loginOffline(name, teamId) {
        const trimmedName = name.trim();
        if (!trimmedName) {
          this.addToast('Please enter your name.', 'error');
          return;
        }

        this.db.currentUser = {
          id: `user-${Date.now()}`,
          name: trimmedName,
          teamId: teamId
        };
        this.saveDatabase();
        this.addToast(`Welcome back, ${trimmedName}!`, 'success');
        this.render();
      }

      openCreateTeamModal() {
        const modal = document.getElementById('create-team-modal');
        document.getElementById('new-team-name').value = '';
        document.getElementById('new-team-desc').value = '';
        document.getElementById('new-team-new-repo').value = '';
        this.newTeamRepos = [];
        this.renderNewTeamRepos();
        modal.style.display = 'flex';
      }

      closeCreateTeamModal() {
        document.getElementById('create-team-modal').style.display = 'none';
      }

      addRepoToNewTeamList() {
        const input = document.getElementById('new-team-new-repo');
        const repo = input.value.trim();
        if (!repo) {
          this.addToast('Repository name cannot be empty.', 'error');
          return;
        }
        if (this.newTeamRepos.includes(repo)) {
          this.addToast('Repository already added.', 'error');
          return;
        }
        this.newTeamRepos.push(repo);
        input.value = '';
        this.renderNewTeamRepos();
      }

      removeRepoFromNewTeamList(repoName) {
        this.newTeamRepos = this.newTeamRepos.filter(r => r !== repoName);
        this.renderNewTeamRepos();
      }

      quickAddRepo(repoName) {
        if (this.newTeamRepos.includes(repoName)) {
          this.addToast('Repository already added.', 'error');
          return;
        }
        this.newTeamRepos.push(repoName);
        this.renderNewTeamRepos();
      }

      renderNewTeamRepos() {
        const container = document.getElementById('new-team-repo-list');
        if (this.newTeamRepos.length === 0) {
          container.innerHTML = '<span style="font-size: 0.75rem; color: var(--color-muted); width: 100%; text-align: center;">No repositories added yet</span>';
          return;
        }
        container.innerHTML = this.newTeamRepos.map(repo => `
          <span class="reviewerLabel" style="background-color: var(--color-border-light); border-color: var(--color-border); gap: 0.25rem;">
            ${repo}
            <button onclick="app.removeRepoFromNewTeamList('${repo}')" style="color: var(--color-danger); font-weight: bold; margin-left: 2px;">✕</button>
          </span>
        `).join('');
      }

      submitCreateTeamOffline() {
        const nameInput = document.getElementById('new-team-name');
        const descInput = document.getElementById('new-team-desc');
        const name = nameInput.value.trim();
        const desc = descInput.value.trim();

        if (!name) {
          this.addToast('Team name is required.', 'error');
          return;
        }

        const teamId = `team-${Date.now()}`;
        const newTeam = {
          id: teamId,
          name: name,
          description: desc,
          repos: [...this.newTeamRepos]
        };

        this.db.teams.push(newTeam);
        this.saveDatabase();
        this.addToast(`Team "${name}" created offline!`, 'success');

        this.updateTeamDropdowns();
        const teamSelect = document.getElementById('login-select-team');
        if (teamSelect) {
          teamSelect.value = teamId;
        }
        this.closeCreateTeamModal();
      }

      updateTeamDropdowns() {
        const teamSelect = document.getElementById('login-select-team');
        if (teamSelect) {
          teamSelect.innerHTML = this.db.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        }
      }

      logout() {
        this.db.currentUser = null;
        this.saveDatabase();
        this.addToast('Signed out.', 'info');
        this.render();
      }

      // SWITCH TABS
      switchTab(tab) {
        this.currentTab = tab;
        this.render();
      }

      // MODALS FOR REVIEW REQUESTS
      openRequestModal() {
        const modal = document.getElementById('request-modal');
        const repoSelect = document.getElementById('modal-select-repo');
        
        const team = this.db.teams.find(t => t.id === this.db.currentUser.teamId);
        const repos = team?.repos || [];

        if (repos.length === 0) {
          this.addToast('You must add repositories in Team Settings first!', 'error');
          return;
        }

        repoSelect.innerHTML = repos.map(r => `<option value="${r}">${r}</option>`).join('');
        modal.style.display = 'flex';
      }

      closeRequestModal() {
        document.getElementById('request-modal').style.display = 'none';
        document.getElementById('modal-pr-name').value = '';
        document.getElementById('modal-pr-url').value = '';
      }

      submitRequestCR() {
        const titleInput = document.getElementById('modal-pr-name');
        const urlInput = document.getElementById('modal-pr-url');
        const repoSelect = document.getElementById('modal-select-repo');
        const reviewersSelect = document.getElementById('modal-reviewers');

        const title = titleInput.value.trim();
        const url = urlInput.value.trim();
        const repo = repoSelect.value;
        const requiredReviewers = parseInt(reviewersSelect.value, 10);

        if (!title) {
          this.addToast('PR Title is required', 'error');
          return;
        }

        const newCR = {
          id: `cr-${Date.now()}`,
          teamId: this.db.currentUser.teamId,
          prTitle: title,
          prUrl: url,
          repoName: repo,
          requiredReviewers,
          status: 'OPEN',
          requesterName: this.db.currentUser.name,
          assignments: [],
          createdAt: new Date().toISOString()
        };

        this.db.crRequests.unshift(newCR);
        this.saveDatabase();
        this.addToast('Review request added successfully!', 'success');
        this.closeRequestModal();
        this.render();
      }

      // OFFLINE REPOS MODAL SETTINGS
      openSettingsModal() {
        document.getElementById('settings-modal').style.display = 'flex';
        this.renderSettingsRepos();
      }

      closeSettingsModal() {
        document.getElementById('settings-modal').style.display = 'none';
      }

      renderSettingsRepos() {
        const container = document.getElementById('settings-repo-list');
        const team = this.db.teams.find(t => t.id === this.db.currentUser.teamId);
        const repos = team?.repos || [];

        if (repos.length === 0) {
          container.innerHTML = '<div style="font-size: 0.8125rem; color: var(--color-muted); text-align: center; padding: 0.5rem 0;">No repositories configured yet.</div>';
          return;
        }

        container.innerHTML = repos.map(repo => `
          <div class="repoListItem">
            <span>${repo}</span>
            <button class="btn btn-danger btn-sm" onclick="app.removeTrackedRepo('${repo}')">Remove</button>
          </div>
        `).join('');
      }

      addTrackedRepo() {
        const input = document.getElementById('settings-new-repo');
        const repoName = input.value.trim();

        if (!repoName) {
          this.addToast('Repository name cannot be empty', 'error');
          return;
        }

        const team = this.db.teams.find(t => t.id === this.db.currentUser.teamId);
        if (!team) return;

        if (team.repos.includes(repoName)) {
          this.addToast('Repository name already exists in this team', 'error');
          return;
        }

        team.repos.push(repoName);
        this.saveDatabase();
        this.addToast(`Added repository "${repoName}" successfully!`, 'success');
        
        input.value = '';
        this.renderSettingsRepos();
        this.render(); 
      }

      removeTrackedRepo(repoName) {
        const team = this.db.teams.find(t => t.id === this.db.currentUser.teamId);
        if (!team) return;

        team.repos = team.repos.filter(r => r !== repoName);
        this.saveDatabase();
        this.addToast(`Removed repository "${repoName}"`, 'info');
        
        this.renderSettingsRepos();
        this.render();
      }

      // WORKFLOW ACTIONS ON CARDS
      takeCR(crId) {
        const cr = this.db.crRequests.find(c => c.id === crId);
        if (!cr) return;

        const currentName = this.db.currentUser.name;
        if (cr.requesterName === currentName) {
          this.addToast("You cannot review your own code!", 'error');
          return;
        }

        if (cr.assignments.some(a => a.reviewerName === currentName)) {
          this.addToast("You have already taken this review request.", 'error');
          return;
        }

        cr.assignments.push({ reviewerName: currentName, status: 'ASSIGNED' });
        this.saveDatabase();
        this.addToast("You've taken the code review! Work your magic.", 'success');
        this.render();
      }

      completeCR(crId) {
        const cr = this.db.crRequests.find(c => c.id === crId);
        if (!cr) return;

        const currentName = this.db.currentUser.name;
        const assignment = cr.assignments.find(a => a.reviewerName === currentName && a.status === 'ASSIGNED');
        if (!assignment) return;

        assignment.status = 'COMPLETED';
        assignment.completedAt = new Date().toISOString();

        // If completed meets required review counts, mark request completed
        if (cr.assignments.filter(a => a.status === 'COMPLETED').length >= cr.requiredReviewers) {
          cr.status = 'COMPLETED';
        }

        this.saveDatabase();
        this.addToast("Code review marked as completed!", 'success');
        this.render();
      }

      cancelCR(crId) {
        // Completely remove the request from list! (Hard delete)
        this.db.crRequests = this.db.crRequests.filter(c => c.id !== crId);
        this.saveDatabase();
        this.addToast("Code review request permanently deleted.", 'info');
        this.render();
      }

      // RENDER CORE BOARD (TAB DETECTED LISTS)
      renderBoard() {
        const container = document.getElementById('board-container');
        const teamId = this.db.currentUser.teamId;

        // Get reviews for this team
        let list = this.db.crRequests.filter(cr => cr.teamId === teamId);

        // Filter list based on selected Tab!
        if (this.currentTab === 'active') {
          list = list.filter(cr => cr.status === 'OPEN');
        } else {
          list = list.filter(cr => cr.status === 'COMPLETED');
        }

        // Sort by date newest first
        list = [...list].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        document.getElementById('board-count-badge').innerText = list.length;

        if (list.length === 0) {
          container.innerHTML = `
            <div class="emptyState">
              <div class="emptyStateIcon">
                <!-- Lock/Inbox SVG icon representing clean empty state -->
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--color-muted);"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              </div>
              <h3>No reviews here</h3>
              <p>${this.currentTab === 'active' 
                ? 'No active review requests right now. Enjoy the peace!' 
                : 'No completed reviews are in the history yet.'}</p>
            </div>
          `;
          return;
        }

        const currentName = this.db.currentUser.name;

        container.innerHTML = `<div class="crGrid">${list.map(cr => {
          const isRequester = cr.requesterName === currentName;
          const isAssigned = cr.assignments.some(a => a.reviewerName === currentName && a.status === 'ASSIGNED');
          
          let actionBtn = '';
          if (cr.status === 'OPEN') {
            if (isRequester) {
              actionBtn = `<button class="btn btn-danger btn-sm" onclick="app.cancelCR('${cr.id}')">Cancel</button>`;
            } else if (isAssigned) {
              actionBtn = `<button class="btn btn-primary btn-sm" onclick="app.completeCR('${cr.id}')">✓ Complete</button>`;
            } else if (cr.assignments.length < cr.requiredReviewers) {
              actionBtn = `<button class="btn btn-secondary btn-sm" onclick="app.takeCR('${cr.id}')">Take CR</button>`;
            }
          }

          const statusBadge = cr.status !== 'OPEN' ? `
            <span class="badge badge-completed">
              <!-- Mini Check SVG -->
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:2px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
              Completed
            </span>
          ` : '';

          const clickableTitle = cr.prUrl ? `
            <a class="prLink" href="${cr.prUrl}" target="_blank" rel="noopener noreferrer">${cr.prTitle} ↗</a>
          ` : cr.prTitle;

          return `
            <article class="crCard">
              <div class="crCardHeader">
                <div class="avatar">${cr.requesterName[0].toUpperCase()}</div>
                <div class="crCardTitle">
                  <h4 title="${cr.prTitle}">${clickableTitle}</h4>
                  <div class="repoName">${cr.repoName}</div>
                </div>
                ${statusBadge}
              </div>

              <div class="crMeta">
                <div class="reviewerSummary">
                  Reviewers: <strong>${cr.assignments.length} / ${cr.requiredReviewers}</strong>
                </div>
                <span class="timeAgo">${timeAgo(cr.createdAt)}</span>
              </div>

              <!-- List active reviewers on the card (Ultra-Premium Badge checklist) -->
              ${cr.assignments.length > 0 ? `
                <div class="assignmentsSection">
                  <strong>Reviewers Board</strong>
                  <div class="reviewersList">
                    ${cr.assignments.map(a => `
                      <span class="reviewerLabel ${a.status === 'COMPLETED' ? 'reviewerCompleted' : ''}">
                        ${a.status === 'COMPLETED' ? `
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:2px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        ` : ''} 
                        ${a.reviewerName}
                      </span>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <div class="crCardFooter">
                <div class="requesterInfo">
                  Requested by <strong>${cr.requesterName}</strong>
                </div>
                <div class="cardActions">
                  ${actionBtn}
                </div>
              </div>
            </article>
          `;
        }).join('')}</div>`;
      }

      // OFFLINE RENDERING BLOCKS
      getLandingViewHTML() {
        return `
          <div class="loginView">
            <h1 class="heroTitle">CR Matcher</h1>
            <p class="heroSubtitle">The 100% offline, local browser sandbox for coordinating code reviews with your team.</p>
            
            <div class="loginCard">
              <h3>Sign In to Board</h3>
              
              <div class="formGroup">
                <label for="login-name">Your Name</label>
                <input id="login-name" class="input" type="text" placeholder="e.g. Harel">
              </div>

              <div class="formGroup">
                <label for="login-select-team">Choose Team</label>
                <select id="login-select-team" class="select">
                  ${this.db.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                </select>
              </div>
              
              <button class="btn btn-primary" onclick="app.loginOffline(document.getElementById('login-name').value, document.getElementById('login-select-team').value)" style="width: 100%; padding: 0.6rem; justify-content: center; font-size: 0.9375rem; margin-top: 0.5rem;">
                Sign In
              </button>

              <div style="text-align: center; margin-top: 1.25rem;">
                <button type="button" onclick="app.openCreateTeamModal()" style="font-size: 0.875rem; text-decoration: underline; color: var(--color-accent); font-weight: 500; border: none; background: none; cursor: pointer;">Or create a new team</button>
              </div>
            </div>
          </div>
        `;
      }

      getDashboardHTML() {
        const team = this.db.teams.find(t => t.id === this.db.currentUser.teamId) || { name: 'Your Team' };
        return `
          <div class="dashboardView">
            <div class="teamHeader">
              <div class="teamInfo">
                <h1>${team.name}</h1>
                ${team.description ? `<p class="text-secondary" style="font-size: 0.875rem;">${team.description}</p>` : ''}
              </div>
              <div class="headerActions">
                <button class="btn btn-primary" onclick="app.openRequestModal()">Ask for Code Review</button>
                <button class="btn btn-secondary" onclick="app.openSettingsModal()">
                  <!-- Gear SVG -->
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:4px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                  Settings
                </button>
              </div>
            </div>

            <!-- Tab Switcher (Active Reviews vs History) -->
            <div class="tabSwitch">
              <button id="tab-active" class="tabBtn tabBtnActive" onclick="app.switchTab('active')">Active Reviews</button>
              <button id="tab-history" class="tabBtn" onclick="app.switchTab('history')">History</button>
            </div>

            <!-- Main Reviews board -->
            <div class="boardHeader">
              <h3 class="boardTitle">
                ${this.currentTab === 'active' ? 'Active Code Reviews' : 'Completed Reviews History'}
                <span id="board-count-badge" class="countBadge">0</span>
              </h3>
            </div>
            <div id="board-container"></div>
          </div>
        `;
      }

      showDashboard() {
        this.render();
      }
    }

    function timeAgo(dateStr) {
      const seconds = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
      if (seconds < 60) return 'just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    const app = new CRMatcherOfflineApp();
    window.addEventListener('DOMContentLoaded', () => app.render());
  </script>
</body>
</html>
